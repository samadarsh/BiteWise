services:
  - type: web
    name: bitewise-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.main:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: APP_ENV
        value: development
      - key: USE_MOCK_MCP
        value: "true"
      - key: SWIGGY_ENV
        value: mock
      # Render's free-plan filesystem is wiped on every deploy and restart,
      # so a SQLite file here loses every account and order. Set this to a
      # Postgres URL (e.g. a Render Postgres instance). Left unset, the app
      # falls back to SQLite and data will not survive a restart.
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ALLOW_PLACE_ORDER
        value: "false"
      - key: FRONTEND_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Keep in step with the Dockerfile and CI (3.12).
      - key: PYTHON_VERSION
        value: "3.12.7"
